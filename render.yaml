# Render Blueprint: New > Blueprint in the Render dashboard, pick this repository.
# Secrets marked `sync: false` are asked for once in the dashboard and never stored in the repo.
# See docs/deployment.md.
services:
  - type: web
    name: trustpool
    runtime: docker
    # Starter, not free: the free plan sleeps after 15 idle minutes, throttled most requests with 429s
    # and 503s during the 26 Nov Sepolia test, and wipes /var/data (evidence, sign-ins) on every restart.
    # Starter keeps one instance up, and the disk below keeps evidence across restarts and redeploys.
    plan: starter
    branch: main
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: trustpool-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DEPLOYMENT_FILE
        value: /app/deployments/sepolia.json
      - key: KEEPER_INTERVAL_MS
        value: "60000"
      - key: LOG_BLOCK_RANGE
        value: "10" # Alchemy's free tier caps eth_getLogs at 10 blocks; raise it on a paid RPC
      - key: RPC_URL
        sync: false # Alchemy/Infura Sepolia HTTPS endpoint
      - key: KEEPER_PRIVATE_KEY
        sync: false # throwaway wallet with ~0.05 Sepolia ETH; never the deployer's key
      - key: EVIDENCE_ENCRYPTION_KEY
        sync: false # openssl rand -hex 32; losing it makes stored evidence unreadable
