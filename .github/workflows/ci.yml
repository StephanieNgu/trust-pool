name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Compile, test, lint, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Run contract tests
        run: npm test

      - name: Lint (ESLint + Solhint)
        run: npm run lint

      - name: Build
        run: npm run build
